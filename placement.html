<html lang="en">
<head>

<title>Up And Up Educational Services — Free Placement Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

:root{
  --bg:#0B1E3A;--ink:#101827;--accent:#0E9F6E;--accent2:#134E4A;
  --teal:#34D399;--teal-dark:#0d9488;--muted:#5b6472;--line:#e4e7ee;
  --card:#ffffff;--paper:#f7f8fb;
  --good:#10b981;--good-bg:#d1fae5;--warn:#f59e0b;--warn-bg:#fef3c7;
  --weak:#ef4444;--weak-bg:#fee2e2;
  --grad:linear-gradient(120deg,#0E9F6E,#134E4A);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(600px 300px at 80% 15%,rgba(52,211,153,.14),transparent 70%),radial-gradient(500px 300px at 15% 85%,rgba(14,159,110,.12),transparent 70%);
  display:flex;align-items:flex-start;justify-content:center;padding:24px 14px 60px;
}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}
.app{width:100%;max-width:700px}
.brand{display:flex;align-items:center;gap:14px;color:#fff;margin:6px 4px 18px}
.brand-mark{width:44px;height:44px;border-radius:12px;flex:0 0 auto;background:var(--grad);display:flex;align-items:center;justify-content:center}
.brand-mark svg{width:20px;height:20px}
.brand h1{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1.1rem;line-height:1.2}
.brand h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .sub{font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-top:2px}
.card{background:var(--card);border-radius:20px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);overflow:hidden}
.card-inner{padding:32px 32px 36px}
@media(max-width:520px){.card-inner{padding:22px 18px 26px}}
.progress-bar{height:5px;background:var(--grad);display:flex}
.progress-bar span{flex:1;background:var(--line)}
.progress-bar span.done{background:var(--accent)}
.progress-bar span.here{background:var(--teal)}
.kicker{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.display{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:2rem;line-height:1.15;color:var(--ink);margin-bottom:16px}
.display em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{font-size:1rem;line-height:1.65;margin-bottom:24px;max-width:54ch;color:var(--muted)}
.skill-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.skill-chip{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:7px 16px 7px 10px;font-size:.82rem;font-weight:700;color:var(--ink)}
.skill-chip .icon{width:26px;height:26px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
label.field{display:block;font-weight:700;font-size:.85rem;margin-bottom:6px;color:var(--ink)}
input[type=text],input[type=password]{width:100%;padding:14px 16px;font:inherit;font-weight:600;border:1px solid var(--line);border-radius:12px;background:var(--paper);margin-bottom:20px;color:var(--ink);font-size:.95rem}
input:focus{outline:3px solid rgba(14,159,110,.35);border-color:var(--accent)}
.btn{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1rem;border:none;border-radius:99px;cursor:pointer;padding:14px 28px;background:linear-gradient(120deg,#F59E0B,#D97706);color:#3A2705;box-shadow:0 8px 24px -8px rgba(217,119,6,.4);transition:transform .1s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1px solid var(--line);font-family:'Inter',sans-serif;font-weight:700;font-size:.92rem}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:10px 20px;font-size:.9rem}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.area-tag{display:inline-flex;align-items:center;gap:8px;background:var(--bg);color:#fff;border-radius:99px;padding:6px 16px 6px 8px;font-size:.8rem;font-weight:700}
.area-tag .ti{width:24px;height:24px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.qcount{font-size:.82rem;font-weight:700;color:var(--muted)}
.timer-bar{display:flex;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:18px;gap:12px}
.timer-clock{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.1rem;color:var(--ink);min-width:70px;text-align:center}
.timer-clock.warn{color:var(--warn)}
.timer-clock.danger{color:var(--weak);animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.timer-track{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.timer-track i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width 1s linear}
.timer-label{font-size:.75rem;font-weight:600;color:var(--muted)}
.qtext{font-family:'Space Grotesk',sans-serif;font-size:1.25rem;font-weight:600;line-height:1.4;margin-bottom:22px;color:var(--ink)}
.choices{display:grid;gap:10px;margin-bottom:28px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-weight:600;font-size:1.02rem;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:15px 18px;cursor:pointer;color:var(--ink);transition:border-color .1s ease,background .1s ease}
.choice:hover{border-color:var(--accent);background:#f0f2ff}
.choice .key{width:32px;height:32px;flex:0 0 auto;border-radius:10px;background:var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
.choice.picked{background:var(--bg);border-color:var(--accent);color:#fff}
.choice.picked .key{background:var(--grad);color:#fff}
.navrow{display:flex;justify-content:space-between;gap:12px}
.score-hero{text-align:center;padding:8px 0 28px}
.score-hero .big{font-family:'Space Grotesk',sans-serif;font-size:3.6rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.score-hero .of{font-weight:700;font-size:.95rem;color:var(--muted);margin-top:4px}
.verdict{display:inline-block;margin-top:14px;background:var(--bg);color:var(--teal);font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:8px 22px}
.report-section{margin:28px 0 12px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1.1rem;color:var(--ink)}
.area-result{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:12px}
.area-result .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.area-result .nm{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.95rem}
.area-result .nm .ai{width:32px;height:32px;border-radius:10px;flex:0 0 auto;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.lvl{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:5px 14px}
.lvl.l3{background:var(--good-bg);color:#065f46}
.lvl.l2{background:var(--warn-bg);color:#92400e}
.lvl.l1{background:var(--weak-bg);color:#991b1b}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:10px}
.meter i{display:block;height:100%;border-radius:99px;transition:width .6s ease}
.meter i.strong{background:var(--good)}.meter i.mid{background:var(--warn)}.meter i.low{background:var(--weak)}
.area-note{font-size:.88rem;line-height:1.55;color:var(--muted)}
.missed-list{font-size:.85rem;color:var(--muted);margin-top:8px;padding-left:18px;line-height:1.6}
.plan{background:var(--bg);color:#fff;border-radius:16px;padding:22px 24px;margin:24px 0 8px;position:relative;overflow:hidden}
.plan::before{content:"";position:absolute;inset:0;background:radial-gradient(400px 200px at 90% 10%,rgba(139,92,246,.25),transparent 70%);pointer-events:none}
.plan>*{position:relative}
.plan h3{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1.05rem;color:var(--teal);margin-bottom:10px}
.plan p{font-size:.92rem;line-height:1.65;color:rgba(255,255,255,.85)}
.plan .next-steps{margin-top:14px;list-style:none}
.plan .next-steps li{padding:6px 0;font-size:.9rem;color:rgba(255,255,255,.8);display:flex;gap:10px;align-items:flex-start}
.plan .next-steps li::before{content:"→";color:var(--teal);font-weight:700;flex-shrink:0}
.resultbtns{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.footer-note{text-align:center;color:rgba(255,255,255,.5);font-size:.75rem;font-weight:600;margin-top:18px;letter-spacing:.04em}
/* grade picker */
.grade-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}
.grade-card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;transition:border-color .1s,transform .1s;text-align:center}
.grade-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.grade-card .g-num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.8rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.grade-card .g-label{font-size:.82rem;font-weight:700;color:var(--muted);margin-top:4px}
.grade-card .g-sub{font-size:.75rem;color:var(--muted);margin-top:6px;line-height:1.4}
.pw-error{color:var(--weak);font-size:.88rem;font-weight:600;margin-bottom:12px;min-height:1.2em}
@media(max-width:520px){.grade-grid{grid-template-columns:1fr}}
@media print{
  body{background:#fff;padding:0;display:block}
  .brand,.progress-bar,.footer-note,.resultbtns,.no-print{display:none!important}
  .card{box-shadow:none;border-radius:0}.card-inner{padding:10px 0}
  .print-head{display:block!important;border-bottom:3px solid var(--accent);padding-bottom:10px;margin-bottom:16px}
  .area-result{break-inside:avoid}
  .plan{background:#f0f2ff!important;color:var(--ink)!important}
  .plan::before{display:none}.plan h3{color:var(--accent)!important}
  .plan p,.plan .next-steps li{color:var(--ink)!important}
}
.print-head{display:none}
.print-head h2{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--ink);font-size:1.3rem}
.print-head p{font-size:.85rem;font-weight:600;color:var(--muted)}


/* ---------- registration gate ---------- */
.reg-form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.reg-form .full{grid-column:1/-1}
.reg-form label{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.reg-form input,.reg-form select{width:100%;padding:14px 16px;font:inherit;font-weight:600;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font-size:.95rem}
.reg-form select option{color:var(--ink)}
.reg-form input:focus,.reg-form select:focus{outline:3px solid rgba(14,159,110,.35);border-color:var(--accent)}
.reg-err{color:var(--weak);font-size:.88rem;font-weight:600;margin-top:8px;grid-column:1/-1}
.free-badge{display:inline-block;background:var(--good-bg);color:#065f46;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:5px 14px;margin-bottom:12px}
@media(max-width:520px){.reg-form{grid-template-columns:1fr}}

</style>
</head>

}

function validEmail(value){
  return value.length<=254 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
}

    {a:3,q:"Area of a sector with radius 6 and central angle 60°?",c:["6π","12π","36π","2π"],k:0},
    {a:3,q:"Two chords intersect inside a circle. The products of their segments are…",c:["Always equal","Never equal","Equal only if chords are equal","Undefined"],k:0},
    {a:4,q:"Volume of a cone: radius 4, height 9? (V = ⅓πr²h)",c:["48π","36π","144π","16π"],k:0},
    {a:4,q:"Surface area of a sphere with radius 5? (SA = 4πr²)",c:["25π","50π","100π","500π"],k:2},
    {a:4,q:"A prism has a triangular base (b=6, h=4) and length 10. Volume?",c:["60","120","240","40"],k:1},
    {a:4,q:"A cylinder's radius is tripled. Volume is multiplied by…",c:["3","6","9","27"],k:2},
    {a:4,q:"Volume of a sphere with radius 3? (V = ⁴⁄₃πr³)",c:["12π","36π","27π","108π"],k:1},
    {a:5,q:"Two figures with the same shape and size are…",c:["similar","congruent","supplementary","complementary"],k:1},
    {a:5,q:"The longest side of a right triangle is the…",c:["leg","base","altitude","hypotenuse"],k:3},
    {a:5,q:"A line that touches a circle at exactly one point is a…",c:["chord","secant","tangent","diameter"],k:2},
    {a:5,q:"An angle formed by two chords meeting inside a circle is an…",c:["central angle","inscribed angle","exterior angle","right angle"],k:1},
    {a:5,q:"Two figures with the same shape but different sizes are…",c:["congruent","similar","equal","symmetric"],k:1}
  ]
}
};

/* ===================== STATE ===================== */
let grade = null;
let regData = {parentName:"",parentEmail:"",studentEmail:"",studentGrade:"",consentedAt:""};
let state = {name:"",idx:0,answers:[],phase:"start"};
let timerInterval = null;
let timerStart = null;
let timerEnd = null;
const TIMER_MINUTES = 90;
const TIMER_SECONDS = TIMER_MINUTES * 60;
const screen = document.getElementById("screen");
const pbar = document.getElementById("pbar");

function drawProgress(){
  if(!grade){pbar.innerHTML="";return}
  const qs=BANKS[grade].questions;
  pbar.innerHTML="";
  qs.forEach((_,i)=>{
    const s=document.createElement("span");
    if(state.phase==="test"){
      if(state.answers[i]!==null)s.classList.add("done");
      if(i===state.idx)s.classList.add("here");
    }else if(state.phase==="results"){s.classList.add("done")}
    pbar.appendChild(s);
  });
}

/* ===================== REGISTRATION SCREEN ===================== */

  screen.innerHTML=`
    <span class="free-badge">100% Free</span>
    <div class="display">Find your child's <em>starting point.</em></div>
    <p class="lede">Our placement test identifies exactly where your child is strong and where they need support — so tutoring starts in the right place from day one. It takes about 30 minutes, covers 30 questions, and results are delivered instantly with a recommended tutoring plan.</p>
    <div class="skill-chips">
      <span class="skill-chip"><span class="icon" style="font-size:10px">30</span>Questions</span>
      <span class="skill-chip"><span class="icon">30</span>Minutes</span>
      <span class="skill-chip"><span class="icon">📊</span>Instant Results</span>
      <span class="skill-chip"><span class="icon">📋</span>Custom Plan</span>
    </div>
    <div class="reg-form">
      <div>

      <div>
        <label for="reg-grade">Student's Current Grade</label>
        <select id="reg-grade" required>
          <option value="">Select grade</option>
          <option value="6">Entering 6th Grade</option>
          <option value="7">Entering 7th Grade</option>

        </select>
      </div>
      <div>
        <label for="reg-student-email">Student Email <span style="font-weight:400;text-transform:none;letter-spacing:0;opacity:.6">(optional)</span></label>
        <input type="email" id="reg-student-email" maxlength="254" autocomplete="email" placeholder="student@email.com">
      </div>
      <div class="full" aria-hidden="true" style="position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden;">

      <label class="full" style="display:flex;gap:10px;align-items:flex-start;text-transform:none;letter-spacing:0;line-height:1.45;">

        <span>I am the parent/guardian or an authorized adult, and I consent to submitting this student's name, grade, and assessment results to Up and Up Educational Services for tutoring and follow-up. This information is not submitted for advertising.</span>
      </label>
      <div class="full" style="display:flex;align-items:flex-end;">
        <button type="button" class="btn" id="reg-btn" style="width:100%">Start the Free Placement Test &rarr;</button>
      </div>
      <div class="reg-err full" id="reg-err" role="alert" aria-live="polite"></div>
    </div>
  `;
  document.getElementById("reg-btn").addEventListener("click", handleRegistration);
}

async function handleRegistration(){
  const parentName = document.getElementById("reg-parent").value.trim();
  const parentEmail = document.getElementById("reg-email").value.trim();
  const studentName = document.getElementById("reg-student").value.trim();
  const studentGrade = document.getElementById("reg-grade").value;
  const studentEmail = document.getElementById("reg-student-email").value.trim();
  const err = document.getElementById("reg-err");

  if(document.getElementById("reg-website").value){ return; }
  if(!parentName){ err.textContent="Please enter a parent/guardian name."; return; }
  if(!validEmail(parentEmail)){ err.textContent="Please enter a valid parent email."; return; }
  if(!studentName){ err.textContent="Please enter the student's first name."; return; }
  if(studentEmail && !validEmail(studentEmail)){ err.textContent="Please enter a valid student email or leave it blank."; return; }
  if(!studentGrade){ err.textContent="Please select the student's current grade."; return; }
  if(!document.getElementById("reg-consent").checked){ err.textContent="Parent/guardian consent is required before starting."; return; }

  const consentedAt = new Date().toISOString();
  regData = {
    parentName: parentName.slice(0,120),
    parentEmail: parentEmail.toLowerCase(),
    studentEmail: studentEmail ? studentEmail.toLowerCase() : "",
    studentGrade,
    consentedAt
  };
  grade = parseInt(studentGrade);
  state = {name:studentName.slice(0,80), idx:0, answers:new Array(BANKS[grade].questions.length).fill(null), phase:"start"};

  err.textContent = "";
  const btn = document.getElementById("reg-btn");
  btn.disabled = true;
  btn.textContent = "Loading assessment...";

  timerStart = new Date();
  timerEnd = null;
  startTimer();
  questionScreen();
}

/* ===================== TIMER ===================== */
function startTimer(){
  if(timerInterval)clearInterval(timerInterval);
  timerInterval=setInterval(updateTimer,1000);
}
function stopTimer(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null}
  timerEnd=new Date();
}
function getElapsedSeconds(){
  if(!timerStart)return 0;
  return Math.floor(((timerEnd||new Date())-timerStart)/1000);
}
function getRemainingSeconds(){
  return Math.max(0,TIMER_SECONDS-getElapsedSeconds());
}
function formatTime(sec){
  const m=Math.floor(sec/60),s=sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function updateTimer(){
  const rem=getRemainingSeconds();
  const el=document.getElementById("timer-display");
  if(el){
    el.textContent=formatTime(rem);
    el.className="timer-clock"+(rem<=300?" danger":rem<=600?" warn":"");
  }
  const track=document.getElementById("timer-track-fill");
  if(track)track.style.width=(rem/TIMER_SECONDS*100)+"%";
  if(rem<=0){stopTimer();resultsScreen()}
}
function getTimestamp(d){return d?d.toLocaleString("en-US",{month:"long",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true}):"—"}
function getDuration(){
  const sec=getElapsedSeconds();
  const m=Math.floor(sec/60),s=sec%60;
  return m+" min "+s+" sec";
}

/* ===================== QUESTION SCREEN ===================== */
function questionScreen(){
  const B=BANKS[grade],qs=B.questions;
  state.phase="test";drawProgress();
  const i=state.idx,Q=qs[i],A=B.areas[Q.a];
  screen.innerHTML=`
    <div class="timer-bar">
      <span class="timer-label">Time remaining</span>
      <div class="timer-track"><i id="timer-track-fill" style="width:${getRemainingSeconds()/TIMER_SECONDS*100}%"></i></div>
      <span class="timer-clock" id="timer-display">${formatTime(getRemainingSeconds())}</span>
    </div>
    <div class="qmeta">
      <span class="area-tag"><span class="ti">${A.icon}</span>${A.name}</span>
      <span class="qcount">${i+1} / ${qs.length}</span>
    </div>
    <div class="qtext" id="question-text">${Q.q}</div>
    <div class="choices" role="group" aria-labelledby="question-text">
      ${Q.c.map((c,ci)=>`
        <button class="choice ${state.answers[i]===ci?"picked":""}" data-c="${ci}">
          <span class="key">${"ABCD"[ci]}</span><span>${c}</span>
        </button>`).join("")}
    </div>
    <div class="navrow">
      <button class="btn ghost" id="backBtn" ${i===0?"disabled":""}>\u2190 Back</button>
      <button class="btn" id="nextBtn">${i===qs.length-1?"Finish & See Results":"Next \u2192"}</button>
    </div>
  `;
  screen.querySelectorAll(".choice").forEach(btn=>{
    btn.addEventListener("click",()=>{
      state.answers[i]=+btn.dataset.c;
      screen.querySelectorAll(".choice").forEach(b=>b.classList.remove("picked"));
      btn.classList.add("picked");drawProgress();
    });
  });
  document.getElementById("backBtn").addEventListener("click",()=>{state.idx--;questionScreen()});
  document.getElementById("nextBtn").addEventListener("click",()=>{
    if(i===qs.length-1){
      const m=state.answers.filter(a=>a===null).length;
      if(m>0&&!confirm(m+" question(s) unanswered. Finish anyway?"))return;
      resultsScreen();
    }else{state.idx++;questionScreen()}
  });
  window.scrollTo({top:0,behavior:"instant"});
}

/* ===================== RESULTS ===================== */
function levelFor(s,t){const p=s/t*100;if(p>=80)return{cls:"l3",label:"Strong",meter:"strong"};if(p>=60)return{cls:"l2",label:"Developing",meter:"mid"};return{cls:"l1",label:"Needs Support",meter:"low"}}

function resultsScreen(){
  const B=BANKS[grade],qs=B.questions;
  stopTimer();
  state.phase="results";drawProgress();
  const perArea=B.areas.map(()=>({right:0,total:0,missed:[]}));
  qs.forEach((Q,i)=>{perArea[Q.a].total++;if(state.answers[i]===Q.k)perArea[Q.a].right++;else perArea[Q.a].missed.push(Q.q)});
  const total=perArea.reduce((s,a)=>s+a.right,0);
  const pct=Math.round(total/qs.length*100);

  let verdict,detail;
  if(pct>=85){verdict="Strong foundation";detail=state.name+" demonstrated solid command of prerequisite skills. Tutoring can focus on previewing upcoming grade-level concepts to start the year ahead."}
  else if(pct>=65){verdict="Good base — targeted gaps to close";detail=state.name+" has a good foundation with specific areas that need reinforcement. The plan below targets those gaps directly."}
  else{verdict="Foundation building recommended";detail=state.name+" will benefit from focused work on core prerequisite skills before moving into new grade-level content."}

  const weakAreas=B.areas.filter((_,ai)=>levelFor(perArea[ai].right,perArea[ai].total).cls!=="l3");
  const strongAreas=B.areas.filter((_,ai)=>levelFor(perArea[ai].right,perArea[ai].total).cls==="l3");

  const needsSupportCount = B.areas.filter((_,ai)=>levelFor(perArea[ai].right,perArea[ai].total).cls==="l1").length;
  const developingCount = B.areas.filter((_,ai)=>levelFor(perArea[ai].right,perArea[ai].total).cls==="l2").length;
  const deficitScore = needsSupportCount * 2 + developingCount;

  let schedFreq, schedLabel, schedDetail;
  if(deficitScore >= 5 || pct < 50){
    schedFreq = 3; schedLabel = "3 sessions per week";
    schedDetail = "With multiple areas needing support, an intensive 3-day schedule (e.g. Monday / Wednesday / Friday, 4:00–5:00 PM) will build momentum and ensure consistent progress.";
  } else if(deficitScore >= 2 || pct < 70){
    schedFreq = 2; schedLabel = "2 sessions per week";
    schedDetail = "With a few areas to strengthen, a 2-day schedule (e.g. Tuesday / Thursday, 4:00–5:00 PM) gives enough frequency to close gaps while leaving time for independent practice.";
  } else {
    schedFreq = 1; schedLabel = "1 session per week";
    schedDetail = "With a strong foundation, a weekly session (e.g. Wednesday, 4:00–5:00 PM) is enough to sharpen skills and preview upcoming content.";
  }

  let nextSteps=[];
  if(weakAreas.length>0){nextSteps.push("Focus areas in priority order: "+weakAreas.map(a=>a.name).join(" → "));nextSteps.push("Sessions will begin with the highest-impact skill gaps and build progressively")}
  if(strongAreas.length>0)nextSteps.push("Strong areas ("+strongAreas.map(a=>a.name).join(", ")+") can be maintained with periodic review");
  if(pct>=65)nextSteps.push("Once gaps are closed, we'll preview upcoming grade-level topics");
  nextSteps.push("Recommended schedule: " + schedLabel + " (Monday–Friday, 4:00–7:00 PM, virtual via Google Meet)");
  nextSteps.push("A follow-up assessment after the first 4 sessions will measure progress and adjust the plan");

  const today=new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
  const startStamp=getTimestamp(timerStart);
  const endStamp=getTimestamp(timerEnd);
  const duration=getDuration();

  const emailLines = [];
  emailLines.push("PLACEMENT TEST RESULTS — " + B.title);
  emailLines.push("Student: " + state.name);
  emailLines.push("Parent: " + regData.parentName + " (" + regData.parentEmail + ")");
  if(regData.studentEmail) emailLines.push("Student Email: " + regData.studentEmail);
  emailLines.push("Date: " + today);
  emailLines.push("Started: " + startStamp);
  emailLines.push("Completed: " + endStamp);
  emailLines.push("Duration: " + duration);
  emailLines.push("Score: " + total + " / " + qs.length + " (" + pct + "%)");
  emailLines.push("Overall: " + verdict);
  emailLines.push("");
  emailLines.push("SKILL BREAKDOWN:");
  B.areas.forEach((a,ai) => {
    const r = perArea[ai], lvl = levelFor(r.right, r.total);
    emailLines.push("  " + a.name + ": " + lvl.label + " (" + r.right + "/" + r.total + ")");
    if(lvl.cls !== "l3" && r.missed.length > 0){
      r.missed.forEach(m => emailLines.push("    • Missed: " + m));
    }
  });
  emailLines.push("");
  emailLines.push("RECOMMENDED SCHEDULE: " + schedLabel);
  emailLines.push(schedDetail);
  emailLines.push("");
  emailLines.push("NEXT STEPS:");
  nextSteps.forEach(s => emailLines.push("  → " + s));

  const areaBreakdown = B.areas.map((a,ai)=>({
    area: a.name,
    correct: perArea[ai].right,
    total: perArea[ai].total,
    level: levelFor(perArea[ai].right, perArea[ai].total).label
  }));
  const missedAll = [];
  B.areas.forEach((a,ai)=>{ perArea[ai].missed.forEach(m=>missedAll.push({area:a.name, question:m})) });

  savePlacementResult({
    parent_name: regData.parentName,
    parent_email: regData.parentEmail,
    student_name: state.name,
    student_email: regData.studentEmail || null,
    consented_at: regData.consentedAt || null,
    grade_level: grade,
    score: total,
    total_questions: qs.length,
    percent: pct,
    verdict: verdict,
    recommended_sessions_per_week: schedFreq,
    area_breakdown: areaBreakdown,
    missed_questions: missedAll,
    started_at: timerStart ? timerStart.toISOString() : null,
    completed_at: timerEnd ? timerEnd.toISOString() : null,
    duration_seconds: getElapsedSeconds(),
    report_text: emailLines.join("\n")
  });

  const safeStudentName=escapeHtml(state.name);
  const safeParentName=escapeHtml(regData.parentName);
  screen.innerHTML=`
    <div class="print-head"><h2>Up And Up Educational Services — ${B.title}</h2><p>Student: ${safeStudentName} · Date: ${today} · Parent: ${safeParentName}</p></div>
    <div class="score-hero">
      <div class="kicker">${safeStudentName}'s Results · ${grade}th Grade Readiness · ${today}</div>
      <div class="big">${total} / ${qs.length}</div>
      <div class="of">${pct}% correct</div>
      <div style="font-size:.82rem;color:var(--muted);margin-top:8px">Started: ${startStamp} · Completed: ${endStamp} · Duration: ${duration}</div><br>
      <span class="verdict">${verdict}</span>
    </div>
    <p style="text-align:center;font-size:.92rem;color:var(--muted);max-width:50ch;margin:0 auto 8px;line-height:1.6">${detail}</p>
    <h3 class="report-section">Skill Breakdown</h3>
    ${B.areas.map((a,ai)=>{
      const r=perArea[ai],lvl=levelFor(r.right,r.total),isWeak=lvl.cls!=="l3";
      return`<div class="area-result">
        <div class="top"><span class="nm"><span class="ai">${a.icon}</span>${a.name}</span><span class="lvl ${lvl.cls}">${lvl.label} · ${r.right}/${r.total}</span></div>
        <div class="meter"><i class="${lvl.meter}" style="width:${r.right/r.total*100}%"></i></div>
        <div class="area-note">${isWeak?a.weak:a.strong}</div>
        ${isWeak&&r.missed.length?`<ul class="missed-list">${r.missed.map(m=>`<li>Missed: ${m}</li>`).join("")}</ul>`:""}
        ${isWeak?`<div style="margin-top:10px;font-size:.82rem;font-weight:700;color:var(--accent)">Recommended practice:</div><ul class="missed-list">${a.tips.map(t=>`<li>${t}</li>`).join("")}</ul>`:""}
      </div>`}).join("")}

    <div class="plan"><h3>Recommended Tutoring Schedule</h3>
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
        <span style="font-family:'Space Grotesk',sans-serif;font-size:2.2rem;font-weight:700;color:var(--teal)">${schedFreq}x</span>
        <span style="font-size:1rem;color:rgba(255,255,255,.85);font-weight:600">${schedLabel}</span>
      </div>
      <p>${schedDetail}</p>
      <p style="margin-top:12px;font-size:.85rem;color:rgba(255,255,255,.6)">All sessions are 60 minutes, virtual via Google Meet, Monday–Friday between 4:00–7:00 PM Eastern.</p>
    </div>

    <div class="plan"><h3>Next Steps</h3><p>${detail}</p><ul class="next-steps">${nextSteps.map(s=>`<li>${s}</li>`).join("")}</ul></div>

    <div id="email-status" role="status" aria-live="polite" style="text-align:center;font-size:.85rem;font-weight:600;color:var(--teal);margin-top:16px;min-height:1.4em" class="no-print"></div>

    <div class="resultbtns no-print">
      <button class="btn" id="printBtn">Print / Save Report</button>
      <a href="https://upandupmath.github.io/upandup-tutoring/#register" class="btn" style="text-decoration:none;display:inline-flex;align-items:center;">Book Tutoring Sessions &rarr;</a>
    </div>`;
  document.getElementById("printBtn").addEventListener("click",()=>window.print());
  window.scrollTo({top:0,behavior:"instant"});
}

const SAVE_URL = "https://otdyhyzghaohnhtwzkvu.supabase.co/functions/v1/edu-save-placement";

async function savePlacementResult(payload){
  const statusEl = document.getElementById("email-status");
  if(statusEl) statusEl.textContent = "Saving results and sending report...";
  try {
    const resp = await fetch(SAVE_URL, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if(resp.ok && data.status === "saved"){
      if(statusEl) statusEl.textContent = data.email_sent
        ? "\u2713 Results saved and report sent to Brother Truth"
        : "\u2713 Results saved \u2014 report delivery pending";
    } else {
      if(statusEl) statusEl.textContent = "Couldn\u2019t save results \u2014 please screenshot this page and email it to theuauchessclub@gmail.com.";
      console.error("Save failed:", data);
    }
  } catch(e){
    console.error("Save failed:", e);
    if(statusEl) statusEl.textContent = "Couldn't reach the server \u2014 please screenshot this page.";
  }
}

registrationScreen();
</script>
